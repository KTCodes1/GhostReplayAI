# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - GhostReplayAI

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  # One job: install, test and build here, then ship the ready-to-run folder.
  # Azure must not rebuild it (SCM_DO_BUILD_DURING_DEPLOYMENT=false): its build moves
  # node_modules out of the app folder, which breaks the npm workspace links.
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install, test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Drop git metadata from the package
        run: rm -rf .git

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C1B80F12BFF54B96A346109B22FA4FDF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D565FBF1A0DE4B5DB64233607C19110D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A453A93426794DC294BAA2B3F6828686 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'GhostReplayAI'
          slot-name: 'Production'
          package: .
          # Wipe leftovers of an earlier Azure build (oryx-manifest.toml, node_modules.tar.zst),
          # which would otherwise replace node_modules at startup.
          clean: true
          restart: true
